name: Daily Macro Dashboard

# Render and publish the dashboard every business day at 14:30 UTC
# (post-NYSE open).  Manual trigger also available via "Run workflow".

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      NEWSAPI_KEY:  ${{ secrets.NEWSAPI_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::quantmod
            any::tidyquant
            any::fredr
            any::httr
            any::jsonlite
            any::rvest
            any::xml2
            any::plotly
            any::highcharter
            any::reactable
            any::gt
            any::kableExtra
            any::tidytext
            any::syuzhet
            any::yaml
            any::digest
            any::patchwork
            any::htmltools
            any::rmarkdown
            any::here

      - name: Render dashboard
        run: Rscript scripts/run_daily.R

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-macro-${{ github.run_id }}
          path: output/reports/

      # Optional: publish to GitHub Pages on the gh-pages branch
      - name: Deploy to GitHub Pages
        if: ${{ success() }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/reports
          keep_files: true
